<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Tracker</title>

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b;font-size:14px}
.app{max-width:1200px;margin:0 auto;padding:24px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
h1{font-size:22px;font-weight:700}
.subtitle{font-size:12px;color:#94a3b8;margin-bottom:20px}
.filters{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.filter-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filter-label{font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;min-width:72px}
.fbtn{font-size:11px;padding:3px 10px;border-radius:5px;cursor:pointer;border:1px solid #e2e8f0;background:transparent;color:#64748b;transition:all .15s}
.fbtn.on{border-color:#3b82f6;background:#eff6ff;color:#1d4ed8;font-weight:500}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
th{text-align:left;padding:9px 12px;font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;white-space:nowrap;border-bottom:1.5px solid #e2e8f0;user-select:none}
th:hover{color:#475569}
td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.overdue{background:#fff5f5}
tr.today{background:#fffbeb}
tr.reminder{background:#f8f7ff}
tr.done{opacity:.4}
tr:hover td{background:#f8fafc!important}
.badge{display:inline-block;border-radius:5px;padding:2px 7px;font-size:11px;font-weight:500}
.badge-date{background:#f1f5f9;color:#64748b}
.badge-date.overdue{background:#fee2e2;color:#b91c1c;font-weight:600}
.badge-date.today{background:#fef3c7;color:#92400e;font-weight:600}
.badge-date.reminder{background:#ede9fe;color:#6d28d9}
.badge-am{background:#e0f2fe;color:#0369a1;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:4px}
.badge-pm{background:#fce7f3;color:#be185d;font-size:10px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:4px}
.badge-top{background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;margin-right:6px}
.badge-today-tag{background:#fef3c7;color:#92400e;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;margin-left:6px}
.badge-overdue-tag{background:#fee2e2;color:#b91c1c;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;margin-left:6px}
.badge-done{background:#dcfce7;color:#15803d;font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;margin-left:6px}
.badge-project{background:#eff6ff;color:#1d4ed8;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:500}
.badge-sh{background:#f3f4f6;color:#374151;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:500;margin-right:3px;display:inline-block;margin-bottom:2px}
.badge-link{background:#f0fdf4;color:#15803d;padding:2px 7px;border-radius:5px;font-size:11px;text-decoration:none;display:inline-block;margin-right:3px;margin-bottom:2px;border:1px solid #bbf7d0}
.badge-link:hover{background:#dcfce7}
.id-tag{font-family:monospace;font-size:10px;color:#cbd5e1;background:#f8fafc;padding:1px 5px;border-radius:3px;margin-right:6px}
.expand-arrow{color:#cbd5e1;font-size:10px;cursor:pointer;margin-left:4px}
.notes-row td{padding:0 12px 10px 44px;font-size:12px;color:#64748b;font-style:italic}
.links-row td{padding:2px 12px 10px 44px}
.action-btn{background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .15s}
tr:hover .action-btn{opacity:1}
.btn{padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;border:none;transition:all .15s}
.btn-primary{background:#1d4ed8;color:#fff}
.btn-primary:hover{background:#1e40af}
.btn-primary:disabled{background:#e2e8f0;color:#94a3b8;cursor:default}
.btn-secondary{background:transparent;border:1px solid #e2e8f0;color:#64748b}
.btn-secondary:hover{background:#f8fafc}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-done{font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;border:1px solid #e2e8f0;background:transparent;color:#64748b}
.btn-done.active{background:#f0fdf4;color:#15803d;border-color:#15803d}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:17px;font-weight:700;margin-bottom:20px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.input{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.input:focus{border-color:#3b82f6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.link-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.link-row .input{flex:1}
.remove-link{background:none;border:none;cursor:pointer;color:#ef4444;font-size:16px;padding:0 4px}
.add-link-btn{font-size:12px;color:#1d4ed8;background:none;border:1px dashed #93c5fd;border-radius:5px;padding:4px 10px;cursor:pointer;margin-top:4px}
.add-link-btn:hover{background:#eff6ff}
input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#16a34a}
.today-date{font-size:12px;color:#94a3b8;font-weight:400}

@media(max-width:768px){
  .app{padding:12px}
  h1{font-size:18px}
  .filters{padding:10px 12px;gap:6px}
  .filter-label{min-width:56px;font-size:9px}
  .filter-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filter-row::-webkit-scrollbar{display:none}
  table,thead,tbody,th,td,tr{display:block}
  thead{display:none}
  tr{background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:12px;border:none!important;position:relative}
  tr.overdue{background:#fff5f5}
  tr.today{background:#fffbeb}
  tr.reminder{background:#f8f7ff}
  tr.done{opacity:.4}
  tr:hover td{background:transparent!important}
  td{border:none!important;padding:2px 0!important;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  td:first-child{position:absolute;top:12px;right:12px;width:auto;padding:0!important}
  td:last-child{position:absolute;top:10px;right:36px;padding:0!important}
  .action-btn{opacity:1!important;font-size:12px}
  .notes-row{display:block;background:transparent;box-shadow:none;margin-top:-8px;margin-bottom:10px;border-radius:0 0 10px 10px;padding:0 12px 10px!important}
  .notes-row td{padding:0!important;display:block}
  .links-row{display:block;background:transparent;box-shadow:none;margin-top:-8px;margin-bottom:10px;padding:0 12px 10px!important}
  .links-row td{padding:0!important;display:block}
  .modal{border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0;max-width:100%;max-height:92vh;margin:0;padding:20px 16px}
  .overlay{align-items:flex-end}
  .grid2{grid-template-columns:1fr}
  .btn{padding:10px 14px;font-size:14px}
  .header{flex-wrap:wrap;gap:8px}
  .header>div:last-child{display:flex;gap:6px;flex-wrap:wrap}
  input[type=checkbox]{width:18px;height:18px}
  .badge-sh{margin-bottom:3px}
}
</style>
</head>

function loadDocs(){
  try{const r=localStorage.getItem(STORAGE_KEY+"_docs");return r?JSON.parse(r):{projectDocs:{},stakeholderDocs:{}};}
  catch{return{projectDocs:{},stakeholderDocs:{}};}
}
function saveDocs(pd,sd){
  try{localStorage.setItem(STORAGE_KEY+"_docs",JSON.stringify({projectDocs:pd,stakeholderDocs:sd}));}catch(e){}
}

const EMPTY_FORM={dateInput:"",time:"",activity:"",project:ALL_PROJECTS[0],stakeholder:"",type:"milestone",priority:"",notes:"",links:[]};

function getNextId(rows){
  const nums=rows.map(r=>parseInt(r.id.replace("M-",""))).filter(n=>!isNaN(n));
  return `M-${String(Math.max(0,...nums)+1).padStart(3,"0")}`;
}

function loadData(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch{return null;}
}

function saveData(rows,completed){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({rows,completed,savedAt:new Date().toISOString()}));}catch(e){console.error(e);}
}

function mergeWithSeed(stored,seed){
  const storedById=Object.fromEntries(stored.map(r=>[r.id,r]));
  const seedIds=new Set(seed.map(r=>r.id));
  return[
    ...seed.map(r=>storedById[r.id]?{...r,...storedById[r.id]}:r),
    ...stored.filter(r=>!seedIds.has(r.id)),
  ];
}

function Modal({title,onClose,children}){
  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <h2>{title}</h2>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#94a3b8",lineHeight:1}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function TaskForm({initial,onSave,onCancel,allProjects,allStakeholders}){
  const[form,setForm]=useState(initial||{...EMPTY_FORM,links:[]});
  const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
  const valid=form.dateInput&&form.activity.trim();

  const addLink=()=>setForm(f=>({...f,links:[...(f.links||[]),{label:"",url:""}]}));
  const removeLink=i=>setForm(f=>({...f,links:f.links.filter((_,j)=>j!==i)}));
  const setLink=(i,k,v)=>setForm(f=>({...f,links:f.links.map((l,j)=>j===i?{...l,[k]:v}:l)}));

  const handleSave=()=>{
    if(!valid)return;
    const d=new Date(form.dateInput+"T12:00:00");
    onSave({...form,date:form.dateInput,dateStr:fmtDate(d),links:form.links||[]});
  };

  const addSH=s=>setForm(f=>{
    const cur=f.stakeholder.split(", ").map(x=>x.trim()).filter(Boolean);
    if(cur.includes(s))return f;
    return{...f,stakeholder:cur.concat(s).join(", ")};
  });

  return(
    <div>
      <div className="grid2">
        <div className="field"><label>Date *</label><input type="date" value={form.dateInput} onChange={set("dateInput")} className="input"/></div>
        <div className="field"><label>Time</label>
          <select value={form.time} onChange={set("time")} className="input">
            <option value="">-</option><option value="AM">AM</option><option value="PM">PM</option>
          </select>
        </div>
      </div>
      <div className="field"><label>Activity *</label><input type="text" value={form.activity} onChange={set("activity")} placeholder="What needs to happen?" className="input"/></div>
      <div className="grid2">
        <div className="field"><label>Project</label>
          <select value={form.project} onChange={set("project")} className="input">
            {allProjects.map(p=><option key={p}>{p}</option>)}
          </select>
        </div>
        <div className="field"><label>Type</label>
          <select value={form.type} onChange={set("type")} className="input">
            <option value="milestone">Milestone</option><option value="reminder">Reminder</option>
          </select>
        </div>
      </div>
      <div className="grid2">
        <div className="field"><label>Priority</label>
          <select value={form.priority} onChange={set("priority")} className="input">
            <option value="">Normal</option><option value="high">Top Priority</option>
          </select>
        </div>
      </div>
      <div className="field">
        <label>Stakeholders <span style={{fontWeight:400,textTransform:"none",letterSpacing:0}}>(comma-separated)</span></label>
        <input type="text" value={form.stakeholder} onChange={set("stakeholder")} placeholder="e.g. Sammy, Cookunity Team" className="input"/>
        {allStakeholders.length>0&&(
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:6}}>
            {allStakeholders.slice(0,20).map(s=>(
              <button key={s} onClick={()=>addSH(s)} style={{fontSize:11,padding:"2px 7px",borderRadius:4,border:"1px solid #e2e8f0",background:"#f8fafc",cursor:"pointer",color:"#374151"}}>+{s}</button>
            ))}
          </div>
        )}
      </div>
      <div className="field"><label>Notes</label><textarea value={form.notes} onChange={set("notes")} rows={3} className="input" style={{resize:"vertical"}}/></div>
      <div className="field">
        <label>Google Drive Links / Docs</label>
        {(form.links||[]).map((l,i)=>(
          <div className="link-row" key={i}>
            <input type="text" value={l.label} onChange={e=>setLink(i,"label",e.target.value)} placeholder="Label (e.g. Permit PDF)" className="input" style={{flex:"0 0 140px"}}/>
            <input type="text" value={l.url} onChange={e=>setLink(i,"url",e.target.value)} placeholder="Paste Google Drive URL" className="input"/>
            <button className="remove-link" onClick={()=>removeLink(i)}>×</button>
          </div>
        ))}
        <button className="add-link-btn" onClick={addLink}>+ Add Link / Doc</button>
      </div>
      <div className="modal-footer">
        <button className="btn btn-secondary" onClick={onCancel}>Cancel</button>
        <button className="btn btn-primary" onClick={handleSave} disabled={!valid}>Save</button>
      </div>
    </div>
  );
}

function DocsLibraryModal({allProjects,allStakeholders,projectDocs,stakeholderDocs,onChange,onClose}){
  const[tab,setTab]=useState("projects");
  const[selected,setSelected]=useState(allProjects[0]||"");
  const[localPD,setLocalPD]=useState(JSON.parse(JSON.stringify(projectDocs)));
  const[localSD,setLocalSD]=useState(JSON.parse(JSON.stringify(stakeholderDocs)));

  const items=tab==="projects"?allProjects:allStakeholders;
  const docs=tab==="projects"?(localPD[selected]||[]):(localSD[selected]||[]);

  const setDocs=newDocs=>{
    if(tab==="projects")setLocalPD(p=>({...p,[selected]:newDocs}));
    else setLocalSD(p=>({...p,[selected]:newDocs}));
  };
  const addLink=()=>setDocs([...docs,{label:"",url:""}]);
  const removeLink=i=>setDocs(docs.filter((_,j)=>j!==i));
  const setLink=(i,k,v)=>setDocs(docs.map((l,j)=>j===i?{...l,[k]:v}:l));

  const handleSave=()=>{onChange(localPD,localSD);onClose();};

  const tabStyle=active=>({padding:"6px 14px",cursor:"pointer",border:"none",background:active?"#1d4ed8":"transparent",color:active?"#fff":"#64748b",borderRadius:"6px",fontSize:12,fontWeight:active?600:400});

  return(
    <div className="overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:680}} onClick={e=>e.stopPropagation()}>

        <p style={{fontSize:12,color:"#94a3b8",marginBottom:16}}>Attach Google Drive links to a project or stakeholder — they appear on every matching task automatically.</p>
        <div style={{display:"flex",gap:6,marginBottom:16,background:"#f1f5f9",padding:4,borderRadius:8,width:"fit-content"}}>
          <button style={tabStyle(tab==="projects")} onClick={()=>{setTab("projects");setSelected(allProjects[0]||"");}}>📁 Projects</button>
          <button style={tabStyle(tab==="stakeholders")} onClick={()=>{setTab("stakeholders");setSelected(allStakeholders[0]||"");}}>👤 Stakeholders</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"200px 1fr",gap:16,minHeight:320}}>
          <div style={{background:"#f8fafc",borderRadius:8,padding:8,overflowY:"auto",maxHeight:400}}>
            {items.map(item=>{
              const hasDocs=tab==="projects"?(localPD[item]||[]).length>0:(localSD[item]||[]).length>0;
              return(
                <div key={item} onClick={()=>setSelected(item)} style={{padding:"7px 10px",borderRadius:6,cursor:"pointer",fontSize:12,background:selected===item?"#eff6ff":"transparent",color:selected===item?"#1d4ed8":"#374151",fontWeight:selected===item?600:400,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
                  <span>{item}</span>
                  {hasDocs&&<span style={{fontSize:10,background:"#dcfce7",color:"#15803d",padding:"1px 5px",borderRadius:3,fontWeight:600}}>{tab==="projects"?(localPD[item]||[]).length:(localSD[item]||[]).length}</span>}
                </div>
              );
            })}
          </div>
          <div>
            <div style={{fontWeight:600,fontSize:13,marginBottom:12,color:"#1e293b"}}>
              Links for: <span style={{color:"#1d4ed8"}}>{selected}</span>
            </div>
            {docs.map((l,i)=>(
              <div className="link-row" key={i} style={{marginBottom:8}}>
                <input type="text" value={l.label} onChange={e=>setLink(i,"label",e.target.value)} placeholder="Label (e.g. Permit PDF)" className="input" style={{flex:"0 0 150px"}}/>
                <input type="text" value={l.url} onChange={e=>setLink(i,"url",e.target.value)} placeholder="Paste Google Drive link" className="input"/>
                <button className="remove-link" onClick={()=>removeLink(i)}>×</button>
              </div>
            ))}
            <button className="add-link-btn" onClick={addLink}>+ Add Link</button>
            {docs.length===0&&<p style={{fontSize:12,color:"#94a3b8",fontStyle:"italic",marginTop:8}}>No links yet. Add one above.</p>}
          </div>
        </div>
        <div className="modal-footer" style={{marginTop:20}}>
          <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave}>Save Library</button>
        </div>
      </div>
    </div>
  );
}

function FilterBar({label,options,active,onToggle,onClear}){
  const allSelected=active.size===0;
  return(
    <div className="filter-row">
      <span className="filter-label">{label}</span>
      <button className={`fbtn${allSelected?" on":""}`} onClick={onClear}>All</button>
      {options.map(o=><button key={o} className={`fbtn${active.has(o)?" on":""}`} onClick={()=>onToggle(o)}>{o}</button>)}
    </div>
  );
}


// ─── Export / Import ───────────────────────────────────────────────────────
function exportData(rows,completed,projectDocs,stakeholderDocs){
  const payload={rows,completed,projectDocs,stakeholderDocs,exportedAt:new Date().toISOString(),version:2};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`ProjectTracker_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
}

function importData(file,onSuccess){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      onSuccess(data);
    }catch{alert("Invalid backup file.");}
  };
  reader.readAsText(file);
}

function App(){
  const[allRows,setAllRows]=useState(SEED);
  const[loaded,setLoaded]=useState(false);
  const[completed,setCompleted]=useState({});
  const userChanged=useRef(false);
  const[sortCol,setSortCol]=useState("date");
  const[sortAsc,setSortAsc]=useState(true);
  const[projectFilter,setProjectFilter]=useState(new Set());
  const[stakeholderFilter,setStakeholderFilter]=useState(new Set());
  const[typeFilter,setTypeFilter]=useState(new Set());
  const[timeFilter,setTimeFilter]=useState(new Set());
  const[hideCompleted,setHideCompleted]=useState(false);
  const[expandedId,setExpandedId]=useState(null);
  const[hovered,setHovered]=useState(null);
  const[formMode,setFormMode]=useState(null);
  const[deleteConfirm,setDeleteConfirm]=useState(null);
  const[showDocsLib,setShowDocsLib]=useState(false);
  const[showImport,setShowImport]=useState(false);
  const importRef=useRef(null);
  const[projectDocs,setProjectDocs]=useState({});
  const[stakeholderDocs,setStakeholderDocs]=useState({});

  useEffect(()=>{
    const saved=loadData();
    if(saved){
      const merged=mergeWithSeed(saved.rows||[],SEED);
      setAllRows(merged);
      if(saved.completed)setCompleted(saved.completed);
    }
    const savedDocs=loadDocs();
    setProjectDocs(savedDocs.projectDocs||{});
    setStakeholderDocs(savedDocs.stakeholderDocs||{});
    setLoaded(true);
  },[]);

  useEffect(()=>{
    if(!loaded)return;
    saveData(allRows,completed);
  },[allRows,completed,loaded]);

  useEffect(()=>{
    if(!loaded)return;
    saveDocs(projectDocs,stakeholderDocs);
  },[projectDocs,stakeholderDocs,loaded]);

  const allStakeholders=useMemo(()=>Array.from(new Set(allRows.flatMap(r=>r.stakeholder?r.stakeholder.split(", ").map(s=>s.trim()).filter(Boolean):[]))).sort(),[allRows]);
  const allProjects=useMemo(()=>Array.from(new Set([...ALL_PROJECTS,...allRows.map(r=>r.project)])).filter(Boolean),[allRows]);

  const toggle=setter=>val=>setter(p=>{const n=new Set(p);n.has(val)?n.delete(val):n.add(val);return n;});
  const clear=setter=>()=>setter(new Set());

  const rows=useMemo(()=>{
    let d=[...allRows];
    if(projectFilter.size>0)d=d.filter(r=>projectFilter.has(r.project));
    if(stakeholderFilter.size>0)d=d.filter(r=>r.stakeholder.split(", ").some(s=>stakeholderFilter.has(s.trim())));
    if(typeFilter.size>0)d=d.filter(r=>(typeFilter.has("Milestones")&&r.type==="milestone")||(typeFilter.has("Reminders")&&r.type==="reminder"));
    if(timeFilter.size>0)d=d.filter(r=>(timeFilter.has("AM")&&r.time==="AM")||(timeFilter.has("PM")&&r.time==="PM")||(timeFilter.has("Unset")&&!r.time));
    if(hideCompleted)d=d.filter(r=>!completed[r.id]);
    d.sort((a,b)=>{
      let av=sortCol==="date"?new Date(a.date):a[sortCol]||"";
      let bv=sortCol==="date"?new Date(b.date):b[sortCol]||"";
      if(typeof av==="string"){av=av.toLowerCase();bv=bv.toLowerCase();}
      if(av<bv)return sortAsc?-1:1;
      if(av>bv)return sortAsc?1:-1;
      return 0;
    });
    return d;
  },[allRows,sortCol,sortAsc,projectFilter,stakeholderFilter,typeFilter,timeFilter,hideCompleted,completed]);

  const handleSort=k=>{if(sortCol===k)setSortAsc(a=>!a);else{setSortCol(k);setSortAsc(true);}};
  const toggleComplete=(id,e)=>{e.stopPropagation();userChanged.current=true;setCompleted(p=>({...p,[id]:!p[id]}));};
  const completedCount=Object.values(completed).filter(Boolean).length;

  const handleAdd=data=>{userChanged.current=true;const id=getNextId(allRows);setAllRows(p=>[...p,{...data,id}]);setFormMode(null);};
  const handleEdit=data=>{userChanged.current=true;setAllRows(p=>p.map(r=>r.id===formMode.id?{...data,id:r.id}:r));setFormMode(null);};
  const handleDelete=id=>{userChanged.current=true;setAllRows(p=>p.filter(r=>r.id!==id));setDeleteConfirm(null);};

  const handleImport=data=>{
    userChanged.current=true;
    if(data.rows){
      const merged=mergeWithSeed(data.rows,SEED);
      setAllRows(merged);
    }
    if(data.completed)setCompleted(data.completed);
    if(data.projectDocs)setProjectDocs(data.projectDocs);
    if(data.stakeholderDocs)setStakeholderDocs(data.stakeholderDocs);
    alert("Backup restored successfully!");
  };

  const toFormInitial=r=>({dateInput:r.date,time:r.time||"",activity:r.activity,project:r.project,stakeholder:r.stakeholder,type:r.type,priority:r.priority||"",notes:r.notes,links:r.links||[]});

  const cols=[{label:"Date",key:"date"},{label:"Milestone / Activity",key:"activity"},{label:"Project",key:"project"},{label:"Stakeholder",key:"stakeholder"}];

  const todayStr=`${MONTHS[TODAY.getMonth()]} ${TODAY.getDate()}, ${TODAY.getFullYear()}`;

  return(
    <div className="app">
      <div className="header">
        <div>
          <h1>Project Tracker <span className="today-date">— {todayStr}</span></h1>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {completedCount>0&&<button className={`btn-done${hideCompleted?" active":""}`} onClick={()=>setHideCompleted(h=>!h)}>{hideCompleted?`Show done (${completedCount})`:`Hide done (${completedCount})`}</button>}
          <button className="btn btn-secondary" onClick={()=>exportData(allRows,completed,projectDocs,stakeholderDocs)} style={{borderColor:"#e2e8f0"}}>⬇ Export</button>
          <button className="btn btn-secondary" onClick={()=>importRef.current.click()} style={{borderColor:"#e2e8f0"}}>⬆ Import</button>
          <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>{if(e.target.files[0])importData(e.target.files[0],handleImport);e.target.value="";}}/>
          <button className="btn btn-secondary" onClick={()=>setShowDocsLib(true)} style={{borderColor:"#e2e8f0"}}>📁 Docs Library</button>
          <button className="btn btn-primary" onClick={()=>setFormMode("add")}>+ Add Task</button>
        </div>
      </div>
      <p className="subtitle">{rows.length} items · All edits saved locally in your browser</p>

      <div className="filters">
        <FilterBar label="Project" options={allProjects} active={projectFilter} onToggle={toggle(setProjectFilter)} onClear={clear(setProjectFilter)}/>
        <FilterBar label="Stakeholder" options={allStakeholders} active={stakeholderFilter} onToggle={toggle(setStakeholderFilter)} onClear={clear(setStakeholderFilter)}/>
        <FilterBar label="Type" options={["Milestones","Reminders"]} active={typeFilter} onToggle={toggle(setTypeFilter)} onClear={clear(setTypeFilter)}/>
        <FilterBar label="Time" options={["AM","PM","Unset"]} active={timeFilter} onToggle={toggle(setTimeFilter)} onClear={clear(setTimeFilter)}/>
      </div>

      <table>
        <thead>
          <tr>
            <th style={{width:36}}/>
            {cols.map(c=>(
              <th key={c.key} onClick={()=>handleSort(c.key)}>
                {c.label} <span style={{opacity:sortCol===c.key?1:.3,fontSize:9}}>{sortCol===c.key?(sortAsc?"▲":"▼"):"▲"}</span>
              </th>
            ))}
            <th style={{width:60}}/>
          </tr>
        </thead>
        <tbody>
          {rows.map((row,i)=>{
            const done=!!completed[row.id];
            const ov=isOverdue(row.date);
            const td=isToday(row.date);
            const rem=row.type==="reminder";
            const exp=expandedId===row.id;
            const hov=hovered===row.id;
            const hasExtra=row.notes||(row.links&&row.links.length>0);
            const rowClass=`${done?"done":ov?"overdue":td?"today":rem?"reminder":""}`;
            return(
              <React.Fragment key={row.id}>
                <tr className={rowClass} onMouseEnter={()=>setHovered(row.id)} onMouseLeave={()=>setHovered(null)} onClick={()=>hasExtra&&setExpandedId(exp?null:row.id)} style={{cursor:hasExtra?"pointer":"default"}}>
                  <td onClick={e=>e.stopPropagation()}>
                    <input type="checkbox" checked={done} onChange={e=>toggleComplete(row.id,e)}/>
                  </td>
                  <td>
                    <span className={`badge badge-date${ov&&!done?" overdue":td&&!done?" today":rem?" reminder":""}`}>{row.dateStr}</span>
                    {row.time==="AM"&&<span className="badge-am">AM</span>}
                    {row.time==="PM"&&<span className="badge-pm">PM</span>}
                  </td>
                  <td>
                    {row.priority==="high"&&!done&&<span className="badge-top">TOP</span>}
                    <span className={`id-tag`}>{row.id}</span>
                    <span style={{color:done?"#94a3b8":ov&&!done?"#b91c1c":rem?"#6d28d9":"#1e293b",fontStyle:rem?"italic":"normal",textDecoration:done?"line-through":"none"}}>
                      {row.activity}
                    </span>
                    {td&&!done&&<span className="badge-today-tag">TODAY</span>}
                    {ov&&!done&&<span className="badge-overdue-tag">OVERDUE</span>}
                    {done&&<span className="badge-done">DONE</span>}
                    {hasExtra&&<span className="expand-arrow">{exp?"▲":"▼"}</span>}
                  </td>
                  <td><span className="badge-project">{row.project}</span></td>
                  <td>
                    {row.stakeholder?row.stakeholder.split(", ").map(s=><span className="badge-sh" key={s}>{s.trim()}</span>):<span style={{color:"#cbd5e1"}}>—</span>}
                  </td>
                  <td onClick={e=>e.stopPropagation()} style={{textAlign:"right",whiteSpace:"nowrap"}}>
                    <button className="action-btn" title="Edit" onClick={()=>setFormMode({...toFormInitial(row),id:row.id})}>✏️</button>
                    <button className="action-btn" title="Delete" onClick={()=>setDeleteConfirm(row.id)}>🗑</button>
                  </td>
                </tr>
                {exp&&row.notes&&(
                  <tr className="notes-row"><td colSpan={6}>{row.notes}</td></tr>
                )}
                {exp&&(()=>{
                  const taskLinks=row.links||[];
                  const projLinks=projectDocs[row.project]||[];
                  const shLinks=(row.stakeholder||"").split(", ").flatMap(s=>stakeholderDocs[s.trim()]||[]);
                  const allLinks=[...taskLinks,...projLinks,...shLinks];
                  if(allLinks.length===0)return null;
                  return(
                    <tr className="links-row">
                      <td colSpan={6}>
                        {taskLinks.map((l,j)=><a key={"t"+j} href={l.url} target="_blank" rel="noopener noreferrer" className="badge-link">📎 {l.label||l.url}</a>)}
                        {projLinks.map((l,j)=><a key={"p"+j} href={l.url} target="_blank" rel="noopener noreferrer" className="badge-link" style={{background:"#eff6ff",borderColor:"#bfdbfe",color:"#1d4ed8"}}>🗂 {l.label||l.url}</a>)}
                        {shLinks.map((l,j)=><a key={"s"+j} href={l.url} target="_blank" rel="noopener noreferrer" className="badge-link" style={{background:"#fdf4ff",borderColor:"#e9d5ff",color:"#7c3aed"}}>👤 {l.label||l.url}</a>)}
                      </td>
                    </tr>
                  );
                })()}
              </React.Fragment>
            );
          })}
          {rows.length===0&&<tr><td colSpan={6} style={{padding:"2rem",textAlign:"center",color:"#94a3b8",fontStyle:"italic"}}>No items match the current filters.</td></tr>}
        </tbody>
      </table>

      {formMode==="add"&&(
        <Modal title="Add Task" onClose={()=>setFormMode(null)}>
          <TaskForm onSave={handleAdd} onCancel={()=>setFormMode(null)} allProjects={allProjects} allStakeholders={allStakeholders}/>
        </Modal>
      )}
      {formMode&&formMode!=="add"&&(
        <Modal title="Edit Task" onClose={()=>setFormMode(null)}>
          <TaskForm initial={formMode} onSave={handleEdit} onCancel={()=>setFormMode(null)} allProjects={allProjects} allStakeholders={allStakeholders}/>
        </Modal>
      )}
      {showDocsLib&&(
        <DocsLibraryModal
          allProjects={allProjects}
          allStakeholders={allStakeholders}
          projectDocs={projectDocs}
          stakeholderDocs={stakeholderDocs}
          onChange={(pd,sd)=>{userChanged.current=true;setProjectDocs(pd);setStakeholderDocs(sd);}}
          onClose={()=>setShowDocsLib(false)}
        />
      )}
      {deleteConfirm&&(
        <Modal title="Delete task?" onClose={()=>setDeleteConfirm(null)}>
          <p style={{color:"#64748b",margin:"0 0 20px"}}>Permanently remove <strong>{allRows.find(r=>r.id===deleteConfirm)?.activity}</strong>?</p>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
            <button className="btn btn-secondary" onClick={()=>setDeleteConfirm(null)}>Cancel</button>
            <button className="btn btn-danger" onClick={()=>handleDelete(deleteConfirm)}>Delete</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
